<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About Us | Learning Mentor International Academy</title>
  <!-- Google Fonts: Poppins & Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    :root {
      --primary: #8C2C3F;
      --primary-dark: #6d1f2f;
      --accent: #FCB433;
      --accent-hover: #e59e1f;
      --white: #FFFFFF;
      --light-bg: #FAF7F8;
      --text-dark: #222222;
      --text-muted: #555555;
      --border-color: #EAEAEA;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Poppins', sans-serif;
      font-size: 16px;
      line-height: 1.7;
      color: var(--text-dark);
      background-color: var(--white);
      overflow-x: hidden;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.3;
    }

    a {
      text-decoration: none;
      color: inherit;
      transition: all 0.3s ease;
    }

    ul {
      list-style: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Top Bar */
    .top-bar {
      background-color: var(--primary);
      color: var(--white);
      font-size: 13px;
      padding: 10px 0;
    }

    .top-bar .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .top-contact {
      display: flex;
      align-items: center;
      gap: 22px;
      flex-wrap: wrap;
    }

    .top-contact a:hover {
      color: var(--accent);
    }

    .top-contact i {
      color: var(--accent);
      margin-right: 6px;
    }

    .top-socials {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .top-socials a {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    .top-socials a:hover {
      background: var(--accent);
      color: var(--primary);
    }

    /* Navbar */
    .navbar {
      background-color: var(--white);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .navbar .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      width: 46px;
      height: 46px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: var(--white);
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 1px;
    }

    .logo-text h1 {
      font-size: 19px;
      color: var(--primary);
      margin-bottom: 0;
    }

    .logo-text span {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--accent-hover);
      display: block;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 26px;
    }

    .nav-links a {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-dark);
      position: relative;
      padding: 4px 0;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--primary);
      font-weight: 600;
    }

    .nav-links a.active::after,
    .nav-links a:hover::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -2px;
      width: 100%;
      height: 3px;
      background-color: var(--accent);
      border-radius: 2px;
    }

    .btn-primary {
      display: inline-block;
      background-color: var(--accent);
      color: var(--primary);
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 14px;
      padding: 12px 26px;
      border-radius: 6px;
      border: 2px solid var(--accent);
      cursor: pointer;
    }

    .btn-primary:hover {
      background-color: var(--primary);
      color: var(--white);
      border-color: var(--primary);
    }

    .menu-toggle {
      display: none;
      font-size: 24px;
      color: var(--primary);
      background: none;
      border: none;
      cursor: pointer;
    }

    /* Page Banner */
    .page-banner {
      background: linear-gradient(105deg, rgba(140, 44, 63, 0.92), rgba(109, 31, 47, 0.85)),
                  url('https://images.unsplash.com/photo-1541339907198-e08756dedf3f?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
      color: var(--white);
      padding: 85px 0;
      text-align: center;
    }

    .page-banner h2 {
      font-size: 40px;
      color: var(--white);
      margin-bottom: 12px;
      font-weight: 800;
    }

    .breadcrumb {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.12);
      padding: 6px 18px;
      border-radius: 30px;
    }

    .breadcrumb a:hover {
      color: var(--accent);
    }

    .breadcrumb span {
      color: var(--accent);
      font-weight: 600;
    }

    /* Section Basics */
    .section-padding {
      padding: 85px 0;
    }

    .bg-light {
      background-color: var(--light-bg);
    }

    .section-header {
      text-align: center;
      max-width: 680px;
      margin: 0 auto 50px;
    }

    .section-subtitle {
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent-hover);
      display: block;
      margin-bottom: 8px;
    }

    .section-header h2 {
      font-size: 34px;
      margin-bottom: 14px;
    }

    .section-header p {
      color: var(--text-muted);
      font-size: 15px;
    }

    /* Story Grid */
    .story-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      align-items: center;
    }

    .story-img {
      position: relative;
    }

    .story-img img {
      border-radius: 14px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.12);
    }

    .story-quote {
      background: var(--primary);
      color: var(--white);
      padding: 20px 24px;
      border-radius: 10px;
      border-left: 5px solid var(--accent);
      margin-top: -35px;
      margin-left: 24px;
      margin-right: 24px;
      position: relative;
      z-index: 2;
      font-size: 14px;
      font-style: italic;
    }

    .story-content h2 {
      font-size: 32px;
      margin-bottom: 16px;
    }

    .story-content p {
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    /* Mission & Vision Cards */
    .mv-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 30px;
    }

    .mv-card {
      background: var(--white);
      padding: 40px 34px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      border-top: 5px solid var(--primary);
    }

    .mv-card.accent-top {
      border-top-color: var(--accent);
    }

    .mv-icon {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      background-color: rgba(140, 44, 63, 0.1);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin-bottom: 20px;
    }

    .mv-card h3 {
      font-size: 24px;
      margin-bottom: 14px;
    }

    .mv-card p {
      color: var(--text-muted);
      font-size: 15px;
    }

    /* Core Values */
    .values-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
    }

    .value-box {
      background: var(--white);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 30px 22px;
      text-align: center;
      transition: all 0.3s ease;
    }

    .value-box:hover {
      border-color: var(--accent);
      transform: translateY(-5px);
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.07);
    }

    .value-box i {
      font-size: 30px;
      color: var(--accent-hover);
      margin-bottom: 16px;
    }

    .value-box h4 {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .value-box p {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* Leadership / Mentors */
    .team-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 30px;
    }

    .team-card {
      background: var(--white);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(0, 0, 0,
